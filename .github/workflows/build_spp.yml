name: Build my react app

on: 
   push:
       branches: 
         - main
   workflow_dispatch:

jobs:
    build_app: 
             runs-on: ubuntu-latest
             steps:
               - name: Checkout repo
                 uses: actions/checkout@v4

               - name: Setup node.js
                 uses: actions/setup-node@v4
                 with: 
                     node-version: '20'
                     cache: 'npm'

               - name: Install dependencies
                 run: npm ci

               - name: Build app
                 run: npm run build
         
